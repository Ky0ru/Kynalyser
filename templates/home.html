<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KyoAnalyzer</title>
     <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio,line-clamp"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <style>
        @media print {
          body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 0;
            color: #333;
          }
            .remove_for_report{
                display: none;

            }
        }
</style>

</head>
<body class="bg-gray-900">
    <section class="container px-4 pb-16 mx-auto pt-28 sm:pt-32 sm:px-6 text-center">
        <div class="remove_for_report">
            <h1 class="mb-4 text-3xl font-extrabold text-gray-900 dark:text-white md:text-5xl lg:text-6xl"><span class="text-transparent bg-clip-text bg-gradient-to-r to-emerald-600 from-sky-400">KyoAnalyzer</span> pentest toolbox.</h1>
            <div class="flex items-center flex-1 w-full overflow-x-hidden min-h-full dark">
                <form id="Form" class="flex mx-auto flex-col p-12 mt-12">
                    <label for="target" class="block text-sm text-gray-500 dark:text-gray-300">Target (IP or domain name):</label>
                    <input type="text" id="target" name="target" placeholder="192.168.1.25 or target.com" value="example.com" class="block w-full placeholder-gray-400/70 dark:placeholder-gray-500 rounded-lg border border-gray-200 bg-white mt-4 px-5 py-2.5 text-gray-700 focus:border-blue-400 focus:outline-none focus:ring focus:ring-blue-300 focus:ring-opacity-40 dark:border-gray-600 dark:bg-gray-900 dark:text-gray-300 dark:focus:border-blue-300">
                    <button type="submit" class="flex items-center justify-center h-12 px-6 w-64 bg-gradient-to-r to-emerald-600 from-sky-400 mt-8 rounded font-semibold text-sm text-blue-100 hover:bg-blue-700">Start the scan</button>
                </form>
            </div>
            <div id="statusContainer" class="flex mx-auto flex-col pb-4"></div>
            <div id="ErrorContainer" class="flex mx-auto flex-col pb-4"></div>
        </div>
        <div id="cardsContainer" class="flex mx-auto flex-col pb-4"></div>
        <div class="remove_for_report flex items-center flex-1 justify-center w-full overflow-x-hidden min-h-full dark">
            <button id="report-btn" class="remove_for_report flex items-center justify-center h-12 px-6 w-64 bg-gradient-to-r to-emerald-600 from-sky-400 mt-8 rounded font-semibold text-sm text-blue-100 hover:bg-blue-700 hidden" >Make report</button>
        </div>
    </section>
    <script src="../static/app.js"></script>
</body>
</html>
